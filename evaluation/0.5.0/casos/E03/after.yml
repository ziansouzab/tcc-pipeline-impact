name: Avaliação de análise de impacto
'on': pull_request
jobs:
  produzir:
    runs-on: ubuntu-24.04
    steps:
    - run: echo evidência > saida.txt
    - id: publicar
      uses: actions/upload-artifact@v4
      with:
        name: inventario
        path: saida.txt
      if: ${{ github.base_ref == 'main' }}
  examinar:
    runs-on: ubuntu-24.04
    needs: produzir
    steps:
    - id: obter
      uses: actions/download-artifact@v4
      with:
        name: inventario
        path: recebidos
