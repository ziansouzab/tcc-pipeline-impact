name: Avaliação de análise de impacto
'on': pull_request
jobs:
  escrever:
    runs-on: ubuntu-24.04
    steps:
    - run: echo evidência > saida.txt
    - id: publicar
      uses: actions/upload-artifact@v4
      with:
        name: inventario-final
        path: saida.txt
  revisar:
    runs-on: ubuntu-24.04
    steps:
    - run: echo revisão
  ler:
    runs-on: ubuntu-24.04
    steps:
    - id: obter
      uses: actions/download-artifact@v4
      with:
        name: inventario-final
        path: recebidos
