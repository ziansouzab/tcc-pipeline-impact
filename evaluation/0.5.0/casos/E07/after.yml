name: Avaliação de análise de impacto
'on': pull_request
jobs:
  montar:
    runs-on: ubuntu-24.04
    steps:
    - run: echo evidência > saida.txt
    - id: publicar
      uses: actions/upload-artifact@v4
      with:
        name: catalogo
        path: saida.txt
  organizar:
    runs-on: ubuntu-24.04
    needs: montar
    steps:
    - run: echo organizar
  ler:
    runs-on: ubuntu-24.04
    needs: organizar
    steps:
    - id: obter
      uses: actions/download-artifact@v4
      with:
        name: catalogo
        path: recebidos
