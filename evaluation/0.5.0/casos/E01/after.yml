name: Avaliação de análise de impacto
'on': pull_request
jobs:
  empacotar:
    runs-on: ubuntu-24.04
    steps:
    - run: echo evidência > saida.txt
    - id: publicar
      uses: actions/upload-artifact@v4
      with:
        name: pacote
        path: saida.txt
  inspecionar:
    runs-on: ubuntu-24.04
    steps:
    - run: echo preparando
    - id: obter
      uses: actions/download-artifact@v4
      with:
        name: pacote
        path: recebidos
  checagem:
    runs-on: ubuntu-24.04
    steps:
    - run: echo checagem independente
