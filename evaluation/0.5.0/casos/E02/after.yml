name: Avaliação de análise de impacto
'on': pull_request
jobs:
  gerar:
    runs-on: ubuntu-24.04
    steps:
    - run: echo evidência > saida.txt
    - id: publicar
      uses: actions/upload-artifact@v4
      with:
        name: indice
        path: saida.txt
  preparar:
    runs-on: ubuntu-24.04
    steps:
    - run: echo preparar
  consultar:
    runs-on: ubuntu-24.04
    needs: preparar
    steps:
    - id: obter
      uses: actions/download-artifact@v4
      with:
        name: indice
        path: recebidos
