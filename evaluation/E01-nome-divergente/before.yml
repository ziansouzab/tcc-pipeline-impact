name: Avaliação E01
'on':
  - push
  - pull_request
permissions:
  contents: read
jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir -p dist
          printf '%s\n' 'bundle de exemplo' > dist/bundle.txt
          printf '%s\n' 'metadados de exemplo' > dist/metadata.txt
      - uses: actions/upload-artifact@v4
        with:
          name: bundle
          path: dist/bundle.txt
      - uses: actions/upload-artifact@v4
        with:
          name: metadata
          path: dist/metadata.txt
  verify:
    needs: pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bundle
          path: downloads/bundle
      - uses: actions/download-artifact@v4
        with:
          name: metadata
          path: downloads/metadata
