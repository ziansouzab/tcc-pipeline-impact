name: Caso 03 de laboratório com precedência restaurada

on: workflow_dispatch

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - run: echo etapa experimental
      - run: mkdir -p dist && echo exemplo > dist/app.txt
      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: dist/app.txt

  verify:
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - run: echo etapa experimental
      - uses: actions/download-artifact@v4
        with:
          name: app
